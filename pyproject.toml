[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "win10startmenu"
version = "0.1.0"
description = "Windows 10 style start menu for the Xfce desktop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }

[project.scripts]
win10startmenu = "win10startmenu.application:main"

[tool.setuptools]
packages = ["win10startmenu"]

[tool.setuptools.package-data]
win10startmenu = ["style.css"]
